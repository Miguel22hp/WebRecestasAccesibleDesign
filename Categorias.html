<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipes Organized by Categories</title>
    <link rel="stylesheet" href="https://unpkg.com/@reach/accordion@0.18.0/styles.css" />
    <link rel="stylesheet" href="./css/categorias.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "htm": "https://esm.sh/htm@3.1.1"
        }
      }
    </script>
  </head>
  <body>
    <main id="root"></main>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import htm from "htm";
      import {
        Accordion,
        AccordionItem,
        AccordionButton,
        AccordionPanel
      } from "https://esm.sh/@reach/accordion@0.18.0?external=react,react-dom";

      const html = htm.bind(React.createElement);

      // Mapping of recipe names to IDs
      const recipeMapping = {
        "Quick tacos": "tacos",
        "Quinoa salad": "ensalada", 
        "Vegan bowl": "vegana",
        "Baked salmon": "salmon"
      };

      const categories = [
        {
          name: "Quick Recipes",
          recipes: ["Quick tacos"]
        },
        {
          name: "Vegan Recipes",
          recipes: ["Quinoa salad", "Vegan bowl"]
        },
        {
          name: "Fish Recipes",
          recipes: ["Baked salmon"]
        },
        {
          name: "Oven Recipes",
          recipes: ["Baked salmon"]
        }
      ];

      function App() {

        const handleRecipeClick = (recipeName) => {
          const recipeId = recipeMapping[recipeName];
          if (recipeId) {
            window.location.href = `./Receta.html?id=${recipeId}`;
          }
        };

        return html`
          <section className="page">
            <header className="headerFav">
              <h1>Categories</h1>
              <a className="link" href="./Index.html">Back to home</a>
            </header>
            <p className="muted">Expand the accordion to see ideas.</p>

            <${Accordion} collapsible>
              ${categories.map((cat, index) => html`
                <${AccordionItem} key=${cat.name} index=${index}>
                  <h2>
                    <${AccordionButton} className="accordion__button">${cat.name}<//>
                  </h2>
                  <${AccordionPanel} className="accordion__panel">
                    <ul className="list">
                      ${cat.recipes.map((item) => html`
                        <li key=${item}>
                          <button 
                            className="recipe-link"
                            onClick=${() => handleRecipeClick(item)}
                            aria-label=${`View ${item} recipe`}
                            onKeyDown=${(e) => {
                              if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                handleRecipeClick(item);
                              }
                            }}
                          >
                            ${item}
                          </button>
                        </li>
                      `)}
                    </ul>
                  <//>
                <//>
              `)}
            <//>

          </section>
        `;
      }

      const root = document.getElementById("root");
      if (!root) {
        throw new Error("Root container not found");
      }

      createRoot(root).render(html`<${App} />`);
    </script>
  </body>
</html>
