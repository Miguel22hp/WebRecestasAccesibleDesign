<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Website Home Page</title>
    <link rel="stylesheet" href="https://unpkg.com/@reach/combobox@0.18.0/styles.css" /> <!-- Combobox styles -->
    <link rel="stylesheet" href="https://unpkg.com/@reach/menu-button@0.18.0/styles.css" /> <!-- MenuButton styles -->
    <link rel="stylesheet" href="./css/index.css" /> <!-- Custom styles -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "htm": "https://esm.sh/htm@3.1.1"
        }
      }
    </script>
    <!-- Alias for React UI-->
  </head>
  <body>
    <a href="#root" class="skip-link">Skip to main content</a>
    <main id="root"></main>
    <script type="module">
      // Import React components to use Combobox and MenuButton
      import React from "react";
      import { createRoot } from "react-dom/client";
      import htm from "htm";
      import {
        Combobox,
        ComboboxInput,
        ComboboxPopover,
        ComboboxList,
        ComboboxOption
      } from "https://esm.sh/@reach/combobox@0.18.0?external=react,react-dom";
      import {
        Menu,
        MenuList,
        MenuButton,
        MenuItem
      } from "https://esm.sh/@reach/menu-button@0.18.0?external=react,react-dom";


      const html = htm.bind(React.createElement);

      // Array with example recipes
      const recipes = [
        { id: "ensalada", name: "Quinoa salad" },
        { id: "tacos", name: "Quick tacos" },
        { id: "salmon", name: "Baked salmon" },
        { id: "vegana", name: "Vegan bowl" }
      ];

      function App() {
        const [query, setQuery] = React.useState("");
        const filtered = React.useMemo(() => {
          const q = query.trim().toLowerCase();
          return recipes.filter((r) => r.name.toLowerCase().includes(q));
        }, [query]);

        // Function to render text with custom highlight
        const renderHighlightedText = (text, highlight) => {
          if (!highlight.trim()) return text;
          
          const parts = text.split(new RegExp(`(${highlight})`, 'gi'));
          return parts.map((part, i) => 
            part.toLowerCase() === highlight.toLowerCase() 
              ? html`<strong key=${i} style=${{ color: 'var(--highlight-text)' }}>${part}</strong>`
              : part
          );
        };

        // Filtered returns the list of recipes
        // If you type in the combobox, it filters recipes that match what's written

        const handleSelect = (value) => {
          const found = recipes.find((r) => r.name === value);
          if (found) {
            window.location.href = `./Receta.html?id=${found.id}`;
          }
        };
        // If a recipe is selected from the combobox, navigate to that recipe's page
        

        return html`
          <section className="page">
            <header className="hero">
              <h1>Home</h1>
              <p className="lead">Search for a recipe with the combobox or use the menubutton to navigate.</p>
            </header>

            <div className="widgets">
              <div>
                <p className="eyebrow">Combobox</p>
                <${Combobox} aria-label="Search recipe" onSelect=${handleSelect}>
                  <${ComboboxInput}
                    className="input"
                    placeholder="Type 'tacos', 'salmon' and go to the recipe."
                    value=${query}
                    onChange=${(event) => setQuery(event.target.value)}
                  />
                  <${ComboboxPopover} portal=${false} className="popover">
                    <${ComboboxList}> 
                      ${filtered.length === 0 && query.trim().length > 0 && html`
                        <li className="empty" role="status" aria-live="polite">
                          No recipes found for "${query}". Try another recipe.
                        </li>
                      `}
                      ${filtered.map((r) => html`
                        <${ComboboxOption} key=${r.id} value=${r.name}>
                          ${renderHighlightedText(r.name, query)}
                        <//>
                      `)}
                    <//>
                  <//>
                <//>
              </div>

              <div>
                <p className="eyebrow">Menubutton</p>
                <${Menu}>
                  <${MenuButton} className="menu-btn">Quick menu ▾</>
                  <${MenuList} className="menu-list">
                    <${MenuItem} onSelect=${() => (window.location.href = "./Favoritos.html")}>Favorites</>
                    <${MenuItem} onSelect=${() => (window.location.href = "./Categorias.html")}>Categories</>
                    <${MenuItem} onSelect=${() => (window.location.href = "./Subir_Receta.html")}>Upload recipe</>
                  <//>
                <//>
              </div>
            </div>
          </section>
        `;
      }

      const root = document.getElementById("root");
      if (!root) {
        throw new Error("Root container not found");
      }

      createRoot(root).render(html`<${App} />`);
    </script>
  </body>
</html>
