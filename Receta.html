<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe of a Dish</title>
    <link rel="stylesheet" href="https://unpkg.com/@reach/tabs@0.18.0/styles.css" />
    <link rel="stylesheet" href="./css/receta.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "htm": "https://esm.sh/htm@3.1.1"
        }
      }
    </script>
  </head>
  <body>
    <main id="root"></main>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import htm from "htm";
      import { Tabs, TabList, Tab, TabPanels, TabPanel } from "https://esm.sh/@reach/tabs@0.18.0?external=react,react-dom";

      const html = htm.bind(React.createElement);

      const recipes = {
        ensalada: {
          name: "Quinoa salad",
          time: "20 min",
          difficulty: "easy",
          ingredients: ["Quinoa", "Cucumber", "Cherry tomato", "Avocado", "Olive oil", "Lemon", "Salt"],
          steps: [
            "Cook the quinoa according to package instructions.",
            "Cut the cucumber, tomato and avocado into small cubes.",
            "Mix all ingredients in a bowl.",
            "Dress with olive oil, lemon and salt to taste."
          ],
          images: [
            "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=900&q=80"
          ]
        },
        tacos: {
          name: "Quick chicken tacos",
          time: "15 min",
          difficulty: "easy",
          ingredients: ["Tortillas", "Shredded chicken", "Pico de gallo", "Cilantro", "Lime", "Onion"],
          steps: [
            "Heat the tortillas in a pan.",
            "Sauté the chicken with spices to taste.",
            "Assemble the tacos with pico de gallo and cilantro.",
            "Squeeze lime at the end and serve hot."
          ],
          images: [
            "./images/tacos-rapidos.jpg"
          ]
        },
        salmon: {
          name: "Baked salmon",
          time: "25 min",
          difficulty: "medium",
          ingredients: ["Salmon fillet", "Olive oil", "Lemon", "Garlic", "Rosemary", "Salt", "Pepper"],
          steps: [
            "Preheat the oven to 200°C.",
            "Marinate the salmon with oil, lemon, garlic and spices.",
            "Place on aluminum foil and bake for 15-18 minutes.",
            "Serve with steamed vegetables or salad."
          ],
          images: [
            "https://images.unsplash.com/photo-1467003909585-2f8a72700288?auto=format&fit=crop&w=900&q=80"
          ]
        },
        vegana: {
          name: "Vegan bowl",
          time: "30 min",
          difficulty: "medium",
          ingredients: ["Brown rice", "Chickpeas", "Broccoli", "Carrot", "Hummus", "Sesame seeds", "Avocado"],
          steps: [
            "Cook the brown rice according to instructions.",
            "Sauté the chickpeas with spices.",
            "Steam the broccoli and carrot.",
            "Assemble the bowl with all ingredients and serve with hummus."
          ],
          images: [
            "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=900&q=80"
          ]
        }
      };

      // Function to get the ID parameter from the URL
      function getRecipeId() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('id') || 'tacos'; // Default to tacos if no ID
      }

      const currentRecipeId = getRecipeId();
      const recipe = recipes[currentRecipeId] || recipes.tacos;
      //console.log("ID de la receta:", currentRecipeId);
      //console.log("Receta encontrada:", recipe);
      //console.log("Receta encontrada2:", recipes[currentRecipeId]);
      //console.log("Mostrando receta:", recipe.name);

      function App() {
        return html`
          <section className="page">
            <header className="page__header">
              <h1>Recipe</h1>
              <p className="muted">${recipe.time} · Difficulty ${recipe.difficulty}</p>
              <a className="link" href="./Index.html">Back to home</a>
            </header>

            <h2>${recipe.name}</h2>

            <${Tabs}>
              <${TabList} aria-label="Recipe sections">
                <${Tab}>Ingredients</>
                <${Tab}>Steps</>
                <${Tab}>Images</>
              </>
              <${TabPanels}>
                <${TabPanel}>
                  <ul className="pill-list">
                    ${recipe.ingredients.map((item) => html`<li key=${item} className="pill">${item}</li>`) }
                  </ul>
                <//>
                <${TabPanel}>
                  <ol className="step-list">
                    ${recipe.steps.map((step) => html`<li key=${step}>${step}</li>`) }
                  </ol>
                <//>
                <${TabPanel}>
                  <div className="gallery">
                    ${recipe.images.map((src) => html`
                      <figure key=${src} className="gallery__item">
                        <img src=${src} alt=${`Photo of ${recipe.name}`} loading="lazy" />
                      </figure>
                    `)}
                  </div>
                <//>
              <//>
            <//>
          </section>
        `;
      }

      const root = document.getElementById("root");
      if (!root) {
        throw new Error("Root container not found");
      }

      createRoot(root).render(html`<${App} />`);
    </script>
  </body>
</html>
