<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page to Upload a New Recipe</title>
    <link rel="stylesheet" href="./css/subir_receta.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "htm": "https://esm.sh/htm@3.1.1"
        }
      }
    </script>
  </head>
  <body>
    <main id="root"></main>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import htm from "htm";

      const html = htm.bind(React.createElement);

      function App() {
        const [submitted, setSubmitted] = React.useState(false);
        const [formData, setFormData] = React.useState({
          name: "",
          time: "",
          ingredients: "",
          steps: ""
        });
        
        const handleSubmit = (event) => {
          event.preventDefault();
          setSubmitted(true);
        };

        const handleInputChange = (field, value) => {
          setFormData(prev => ({
            ...prev,
            [field]: value
          }));
        };

        const handleInvalid = (event) => {
          event.target.setCustomValidity("Please fill out this field");
        };

        const handleInput = (event) => {
          event.target.setCustomValidity("");
        };

        return html`
          <section className="page">
            <header className="headerFav">
              <h1>Upload Recipe</h1>
              <a className="link" href="./Index.html">Back to home</a>
            </header>
            <p className="muted">Simple form to share your recipe.</p>
            <form className="form" onSubmit=${handleSubmit}>
              <label className="field">
                <span>Recipe name</span>
                <input 
                  required 
                  name="name" 
                  placeholder="Warm salad"
                  value=${formData.name}
                  onChange=${(e) => handleInputChange('name', e.target.value)}
                  onInvalid=${handleInvalid}
                  onInput=${handleInput}
                  autoComplete="off"
                />
              </label>
              <label className="field">
                <span>Estimated time</span>
                <input 
                  required 
                  name="time" 
                  placeholder="30 min"
                  value=${formData.time}
                  onChange=${(e) => handleInputChange('time', e.target.value)}
                  onInvalid=${handleInvalid}
                  onInput=${handleInput}
                  autoComplete="off"
                />
              </label>
              <label className="field">
                <span>Ingredients (comma separated)</span>
                <textarea 
                  required
                  name="ingredients" 
                  rows="3" 
                  placeholder="Quinoa, avocado, lemon"
                  value=${formData.ingredients}
                  onChange=${(e) => handleInputChange('ingredients', e.target.value)}
                  onInvalid=${handleInvalid}
                  onInput=${handleInput}
                ></textarea>
              </label>
              <label className="field">
                <span>Steps</span>
                <textarea 
                  required
                  name="steps" 
                  rows="4" 
                  placeholder="Describe the steps"
                  value=${formData.steps}
                  onChange=${(e) => handleInputChange('steps', e.target.value)}
                  onInvalid=${handleInvalid}
                  onInput=${handleInput}
                ></textarea>
              </label>
              <div className="form__actions">
                <button type="submit" className="button">Submit</button>
                <a className="button ghost" href="./Index.html">Cancel</a>
              </div>
              ${submitted && html`<p className="success">Recipe submitted. Thank you!</p>`}
            </form>
          </section>
        `;
      }

      const root = document.getElementById("root");
      if (!root) {
        throw new Error("Root container not found");
      }

      createRoot(root).render(html`<${App} />`);
    </script>
  </body>
</html>
